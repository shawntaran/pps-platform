[project]
name = "pps-privacy"
version = "0.1.0"
description = "PPS Platform - GDPR/DPDP privacy guardrail layer"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
ner = ["presidio-analyzer>=2.2", "spacy>=3.7"]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pps_privacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
